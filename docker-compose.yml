services:
  postgres:
    image: postgres:16-alpine
    container_name: davivienda-postgres
    restart: always
    environment:
      POSTGRES_USER: davivienda
      POSTGRES_PASSWORD: davivienda123
      POSTGRES_DB: davivienda_flights
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U davivienda -d davivienda_flights"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: davivienda-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: davivienda-backend
    restart: always
    environment:
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: davivienda
      POSTGRES_PASSWORD: davivienda123
      POSTGRES_DB: davivienda_flights
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SEAT_LOCK_TTL_SECONDS: 300
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: davivienda-frontend
    restart: always
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
